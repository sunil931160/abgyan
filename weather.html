

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="weather.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <div class="card">
    <h2 class="heading">Weather App</h2>
    <div class="inp">
      <input id="inp" type="text" placeholder="Enter the City name">
      <button id="btn"><i class="fa-solid fa-magnifying-glass"></i></button>

    </div>

    <div class="weather">
      <img class="image" src="img/sunny.png">
      <h2 id="temp"> </h2>
      <h2 id="city"></h2>
      <div class="fog">
        <div class="huminidity">
          <div class="img-1">
            <img src="img/fog.png">

          </div>
          <h2 >Huminidity</h2>
          <h2 id="humi"></h2>
        </div>
        <div class="wind">
          <div class="img-1">
            <img src="img/fog.png">
          </div>
          <h2>Wind</h2>
          <h2 id="wind"></h2>
        </div>
      </div>

    </div>
  </div>
</body>
<script src="weathers.js"></script>

</html>
